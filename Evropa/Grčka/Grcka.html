<style>
body{
    font-family:'Georgia',serif;
    background:#f7fcfc;
    color:#23414a;
    text-align:center;
    padding:20px;
    margin:0;
}

h1{
    color:#0b7c8c;
    margin-top:40px;
    margin-bottom:30px;
    font-size:2.2rem;
    display:flex;
    justify-content:center;
    align-items:center;
}

.button-grid{
    display:flex;
    flex-direction:column;
    gap:15px;
    max-width:400px;
    margin:0 auto;
}

/* Orange Beach more */
.btn{
    background:linear-gradient(135deg,#c8f6f5,#66d8df,#1bb8cf);
    color:#07566a;
    border-radius:25px;
    padding:18px 20px;
    text-decoration:none;
    font-size:1.2rem;
    font-weight:bold;
    display:block;
    box-shadow:2px 4px 10px rgba(11,124,140,.18);
    transition:.3s;
}

.btn:hover{
    background:linear-gradient(135deg,#73dfe5,#2fc5d8,#139bb6);
    color:white;
    transform:translateY(-3px);
    box-shadow:3px 6px 12px rgba(11,124,140,.30);
}

.btn:active{
    transform:scale(.95);
}

.back-btn{
    display:inline-block;
    margin-top:50px;
    padding:12px 24px;
    background:#0b7c8c;
    color:white;
    border:none;
    border-radius:20px;
    text-decoration:none;
    font-weight:bold;
    font-size:1rem;
    cursor:pointer;
    transition:.3s;
    box-shadow:2px 2px 6px rgba(11,124,140,.25);
	font-family: "Georgia", serif; 
}

.back-btn:hover{
    background:#085d69;
    transform:scale(1.05);
}

.back-btn:active{
    transform:scale(.95);
}

@media(max-width:600px){
    h1{
        font-size:1.8rem;
    }

    .button-grid{
        width:90%;
    }

    .btn{
        font-size:1.1rem;
        padding:20px;
    }
}
</style>
</head>

<body>

<h1>
    Tirkizna Grčka
    <a href="https://www.instagram.com/sandra.putuje/" target="_blank" rel="noopener noreferrer" style="display:inline-flex;margin-left:12px;">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
             alt="Instagram"
             style="width:26px;height:26px;filter:brightness(0) saturate(100%) invert(36%) sepia(71%) saturate(852%) hue-rotate(147deg) brightness(91%) contrast(92%);">
    </a>
</h1>

<div class="button-grid">
    <a href="Santorini/santorini-i-mikonos.html" class="btn" data-id="santorini">Santorini</a>

    <a href="Sitonija/sitonija.html" class="btn" data-id="sitonija">Sitonija</a>
</div>

<button class="back-btn" onclick="window.location.href='../../index.html?aktivno=grcka'">
    &larr; Nazad na Evropa
</button>

<script>
window.onload=function(){
    const params=new URLSearchParams(window.location.search);
    const aktivna=params.get('aktivna');

    if(aktivna){
        const el=document.querySelector(`.btn[data-id="${aktivna}"]`);
        if(el){
            el.style.background="linear-gradient(135deg,#ffcf5a,#ff9f43)";
            el.style.color="#ffffff";
            el.style.transform="scale(1.02)";
        }
    }
}
</script>

</body>
